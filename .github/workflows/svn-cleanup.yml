name: Clean wp.org SVN

# One-off: removes the .git folders earlier deploys copied into trunk and every
# tag, plus the leftover test tag. Run manually once, then delete this file.
on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove .git from trunk and tags
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq subversion >/dev/null
          base=https://plugins.svn.wordpress.org/fgsync-oblio
          targets=()
          if svn ls "$base/trunk/.git" >/dev/null 2>&1; then targets+=("$base/trunk/.git"); fi
          for tag in $(svn ls "$base/tags/"); do
            tag=${tag%/}
            if [ "$tag" = "zzz-test-tag-delete-me" ]; then
              targets+=("$base/tags/$tag")
            elif svn ls "$base/tags/$tag/.git" >/dev/null 2>&1; then
              targets+=("$base/tags/$tag/.git")
            fi
          done
          if [ ${#targets[@]} -eq 0 ]; then echo "Nothing to remove"; exit 0; fi
          printf 'Removing %s\n' "${targets[@]}"
          svn rm --non-interactive --no-auth-cache --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            -m "Remove .git metadata accidentally shipped by the deploy workflow, and a leftover test tag" \
            "${targets[@]}"
